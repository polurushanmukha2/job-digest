name: daily-job-digest

on:
  schedule:
    # Avoid :00 because GitHub scheduled workflows can be delayed or dropped at top-of-hour load.
    # During EDT: 12:17 UTC = 8:17 AM ET, 16:43 UTC = 12:43 PM ET, 20:43 UTC = 4:43 PM ET
    - cron: "17 12 * * 1-5"
    - cron: "43 16 * * 1-5"
    - cron: "43 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the scanner
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python daily_devops_jobs.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-digest-${{ github.run_id }}
          path: results/

      - name: Commit results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add results/
          git commit -m "Job digest $(date -u +%FT%RZ)" || { echo "nothing to commit"; exit 0; }
          git push || echo "nothing to push"
