name: daily-job-digest

on:
  schedule:
    - cron: "17 12 * * 1-5"
    - cron: "43 16 * * 1-5"
    - cron: "43 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run job scanner
        env:
          APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"
        run: python daily_devops_jobs.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-digest-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git add results/

          if git diff --cached --quiet; then
            echo "No new result files to commit"
            exit 0
          fi

          git commit -m "Job digest $(date -u +%FT%RZ)"
          git push
